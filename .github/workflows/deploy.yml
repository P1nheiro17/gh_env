name: Deployment
on:
  push:
    branches:
      - main
      - dev

#env variables on workflow lever
# MONGO_DB_NAME: Will be available on all jobs 
env:
  MONGO_DB_NAME: gha-demo
  


jobs:
  test:
  #env under test job
  # this will only be available on this level job
    env:
      PORT: 8080
      MONGODB_CLUSTER_ADDRESS: cluster0.15qweeqw.mongodb.net
      MONGODB_PASSWORD: 123456789
      MONGODB_USERNAME: maximilian

    environment: testing
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        #pass env vars to the run command on linus is:
        # $<envVar>
        run: npm start & npx wait-on http://127.0.0.1:$PORT
      - name: Run tests
        run: npm test
      - name: Output information
        run: | 
          echo "MONGODB_USERNAME:$MONGO_DB_NAME"
          echo "MONGO_USERNAME: ${{env.MONGO_DB_NAME}}"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |        
          echo "..."
          echo "MONGO_USERNAME: ${{env.MONGO_DB_NAME}}"
          echo "MONGO_DB_NAME": $MONGO_DB_NAME
